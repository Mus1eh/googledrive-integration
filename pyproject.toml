[project]
name = "google-integration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mus1eh", email = "osamamusleh2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
    "pathlib>=1.0.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
